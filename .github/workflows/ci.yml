# Typecheck, the whole offline test suite (wallet-toolbox mock chain, in-process EVM),
# the security docs' evidence check and the runtime dependency audit, on every push and pull request.
# Separate jobs: RLS against a local Supabase stack (T-22), Slither on the Base HTLC, mutation testing.
# Uses no repository secrets; the token is read-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # npm 10.9 cannot install this workspace (README › Quick start)
      - name: Install
        run: npx -y npm@11 ci
      - name: Typecheck
        run: npm run typecheck && npm -w apps/web run typecheck
      - name: Tests (mock chain, no wallet or satoshis)
        run: npm test
      - name: Security docs cite only existing code and tests
        run: npm run check:docs
      # Runtime dependencies must have no high advisory. The full tree's are build-time only (AUDIT-READINESS §7).
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  supabase-rls:
    # apps/relay/test/*.local.test.ts against `supabase start`: anon reads, never writes (T-22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        # Pin the version: `latest` resolves the newest release through the GitHub
        # API, which rate-limits on shared runners ("Failed to resolve latest … rate
        # limit exceeded"). A pinned version downloads the release asset directly.
        with:
          version: 2.120.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install
        run: npx -y npm@11 ci
      - name: Local Supabase stack (migrations applied on start)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: RLS and sink tests (fail instead of skipping)
        run: |
          eval "$(supabase status -o env | sed -E 's/^([A-Z_]+)=/export SB_\1=/')"
          SUPABASE_LOCAL_URL="$SB_API_URL" SUPABASE_LOCAL_ANON_KEY="$SB_ANON_KEY" SUPABASE_LOCAL_SECRET_KEY="${SB_SECRET_KEY:-$SB_SERVICE_ROLE_KEY}" \
          SUPABASE_LOCAL_REQUIRED=1 npx vitest run apps/relay/test/schema.local.test.ts apps/relay/test/sink.local.test.ts
      - if: always()
        run: supabase stop --no-backup

  slither:
    # static analysis of contracts/base-htlc/HTLC.sol; fails on a high-impact finding (AUDIT-READINESS §7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Slither and solc 0.8.37
        run: |
          python -m pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.37 && solc-select use 0.8.37
      - name: Slither
        run: slither contracts/base-htlc/HTLC.sol --solc-args "--evm-version cancun --optimize --optimize-runs 200" --fail-high

  mutation:
    # hand-written mutants of verify.ts, the script templates and the Base HTLC must all be killed (BL-16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npx -y npm@11 ci
      - name: Mutation testing
        run: npm run mutate
